function distance(a,b){let t=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let old=t[0];t[0]=i;for(let j=1;j<=b.length;j++){let v=t[j];t[j]=Math.min(t[j]+1,t[j-1]+1,old+(a[i-1]===b[j-1]?0:1));old=v}}return t[b.length]}

function question(w,rev){let pool=shuffle(WORDS.filter(z=>compatible(w,z)));let ranked=pool.map(z=>({z,s:(z.p===w.p?7:0)+(z.day===w.day?5:z.d===w.d?3:0)+(rev?Math.max(0,4-distance(w.w,z.w)):0)+Math.random()*3})).sort((a,b)=>b.s-a.s);let picks=[w];for(let {z} of ranked){if(picks.every(x=>compatible(x,z))){picks.push(z);if(picks.length===4)break}}return {id:w.id,rev,opts:shuffle(picks.map(x=>x.id))}}
function startPractice(review){let x=day(D);let pool;if(review){let prev=day(D-1),prior=prev.wrong.map(word).filter(Boolean);pool=[...prior,...shuffle(set(D-1).filter(w=>!prev.wrong.includes(w.id)))].slice(0,10)}else pool=set(D).filter(w=>!x.practice.includes(w.id));if(!pool.length){if(review)pool=shuffle(set(D-1)).slice(0,10);else {x.practice=[];pool=set(D)}}P={review,queue:shuffle(pool.map(w=>w.id)),total:pool.length,done:[],chosen:null,q:null,attempts:0};newPractice()}

function practice(){let q=P.q,w=word(q.id),done=P.review?P.done.length:day(D).practice.length,total=P.review?P.total:50;main.innerHTML=`<div class="row"><span class="badge">${P.review?'전날 복습':'확인 퀴즈'}</span>${btn('나가기','study','small outline')}</div><h2>${done}/${total} 완료</h2>${bar(done,total)}<div class="question" style="margin-top:14px"><div class="tiny">${q.rev?'올바른 영어 단어는?':'올바른 한국어 뜻은?'}</div><div class="word">${esc(q.rev?w.k:w.w)}</div></div>${choices(q,P.chosen,P.chosen!==null)}${P.chosen!==null?`<div class="notice ${P.chosen===q.id?'':'warn'}">${P.chosen===q.id?'정답!':'오답 · 다시 출제됩니다.'} ${esc(w.w)} = ${esc(w.k)}</div>${btn('다음 →','practiceNext','primary')}`:''}`}

async function startExam(){if(E||starting)return;starting=true;let fsRequest=false;if(document.documentElement.requestFullscreen){try{let promise=document.documentElement.requestFullscreen();fsRequest=true;await promise?.catch(()=>{})}catch(e){}}if(S.notify){try{let check=await api('/api/check',{code:S.code});if(!check.telegram)throw Error('Telegram 미설정')}catch(e){modal('서버 연결 실패','<p>'+esc(e.message)+'<br>'+ (REQUIRE_NOTIFY?'보호자에게 서버 설정을 확인해 달라고 요청하세요.':'통보 설정을 확인하거나 로컬 모드로 변경하세요.')+'</p>',[['설정',()=>show('settings'),'primary']]);starting=false;try{if(document.fullscreenElement)document.exitFullscreen()?.catch(()=>{})}catch(e){}return}}let ws=shuffle(set(D)),directions=shuffle(Array.from({length:50},(_,i)=>i<25));E={id:uid(),name:S.name.trim(),day:D,start:now(),deadline:now()+1200000,questions:ws.map((w,i)=>question(w,directions[i])),index:0,answers:{},logs:[],status:'running'};examArmed=false;fsEntered=!!document.fullscreenElement;auditMono=performance.now();lastReceipt=auditMono;beatAt=auditMono;serverFailureAt=0;pushEvent('START',{durationSec:1200,mode:'mixed_25_25',fullscreenRequested:fsRequest,fullscreenActive:fsEntered,width:innerWidth,height:innerHeight});if(!save()){starting=false;E=null;S.active=null;modal('저장 실패','<p>브라우저 저장소를 확인하세요.</p>',[['닫기',null,'outline']]);return}if(S.notify){try{await api('/api/report',{event:'start',report:snapshot(E),code:S.code});lastReceipt=performance.now()}catch(e){starting=false;enqueue(E,'start');terminate('disqualified','시험 시작 통보 또는 서버 연결 실패');return}}starting=false;document.body.classList.add('exam');monoStart=performance.now()-Math.max(0,now()-E.start);show('exam');viewport={w:window.innerWidth,h:window.innerHeight};examArmed=true;armGuards();if(document.hidden){terminate('disqualified','시험 시작 시 화면 숨김');return}clearInterval(tick);tick=setInterval(clock,250);clock()}

function exam(){let q=E.questions[E.index],w=word(q.id),n=Object.keys(E.answers).length,sel=E.answers[q.id]??null;main.innerHTML=`<div class="examtop"><div class="row"><span class="badge bad">● 시험 모드</span><span class="timer" id="timer">20:00</span></div><div class="row tiny"><span>DAY ${E.day} · ${E.index+1}/50 문항</span><span>응답 ${n}/50</span></div>${bar(n)}</div><div class="question"><div class="tiny">${q.rev?'다음 뜻에 해당하는 영어 단어는?':'다음 영어 단어의 한국어 뜻은?'}</div><div class="word">${esc(q.rev?w.k:w.w)}</div></div>${choices(q,sel)}${btn(E.index===49?'시험 제출':'다음 문항 →','examNext','primary',sel===null)}<div class="integrity" id="integrity">● 이탈 감지 활성 · ${S.notify?'서버 전송 모드':'로컬 기록 모드'} <span id="heartbeatLabel">기록 중</span></div><div class="row" style="margin-top:15px"><span class="tiny">시험 이벤트 기록 중</span>${btn('시험 중단','quit','small danger')}</div>`;clock()}

document.addEventListener('freeze',()=>{if(E&&examArmed){pushEvent('VIOLATION',{reason:'브라우저 실행 정지'});terminate('disqualified','브라우저 실행 정지',true)}});

function statusText(r){return r.status==='disqualified'?'자동 탈락':r.status==='timeout'?(r.pass?'시간 종료 · 통과':'시간 종료 · 미통과'):r.pass?'통과':'미통과'}
function result(){let r=S.history.find(x=>x.id===resultId)||S.history[0];if(!r){show('history');return}let count=Object.keys(r.answers).length,secs=Math.max(0,Math.round((r.end-r.start)/1000));main.innerHTML=`<div class="panel center"><span class="badge ${r.pass?'good':'bad'}">${statusText(r)}</span><div class="ring" style="--pct:${r.score}%"><b>${r.score}<small style="font-size:14px">점</small></b></div><h3>DAY ${r.day} 시험 결과</h3><div class="tiny">${esc(r.name)} · ${timeK(r.end)}</div><div class="grid"><div class="stat"><span>정답</span><strong>${r.score/2}/50</strong></div><div class="stat"><span>응답 / 소요</span><strong style="font-size:19px">${count}/50 · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</strong></div></div><div class="notice ${r.status==='disqualified'?'error':''}">${esc(r.reason)} · ${r.sync==='notified'?'보호자 통보 성공':r.sync==='stored'?'서버 저장 완료 · 통보 미확인':r.sync==='pending'?'서버 전송 대기':'로컬 저장 · 직접 공유 필요'}</div>${btn('보호자에게 결과 공유','share','primary')}${btn('가로형 성적표 PNG 저장','png','outline')}${btn('전체 시험 로그 JSON 저장','json','outline')}${btn('학습 메뉴로','resultStudy','blue')}</div><h2>오답 단어 ${r.wrong.length}개</h2><div class="panel">${r.wrong.length?r.wrong.map(id=>{let w=word(id);return `<div class="listword"><b>${esc(w.w)}</b><span>${esc(w.k)}</span></div>`}).join(''):'모두 맞혔습니다.'}</div><h2>시험 로그 · ${r.logs.length}건</h2><div class="auditbox">답안 변경 ${r.logs.filter(l=>l.type==='ANSWER_CHANGE').length}건 · 연결 확인 ${r.logs.filter(l=>l.type==='HEARTBEAT').length}건 · 이탈 ${r.logs.filter(l=>l.type==='VIOLATION').length}건<br>서버 수신 ${r.serverReceipt?esc(timeK(r.serverReceipt)):'미확인 / 로컬'} · 기기 시각과 단조 증가 시간은 JSON에서 확인</div><div class="log">${esc(r.logs.map(x=>`${timeK(x.at)} #${x.seq} ${x.type} ${x.reason||''}${x.number?' Q'+x.number:''}${x.choiceId?' → '+word(x.choiceId).w:''}${x.questionDwellMs!=null?' · '+(x.questionDwellMs/1000).toFixed(1)+'초':''}${x.visibility?' · '+x.visibility:''}`).join('\n'))}</div><div class="foot">브라우저 감지 기록은 부정행위 확정 증거가 아닙니다.</div>`}
function history(){main.innerHTML=`<div class="row"><h3>시험 기록</h3><span class="badge">${S.history.length}회</span></div>${S.history.length?S.history.map(r=>`<button class="day" data-act="result:${esc(r.id)}"><span class="num">${r.score}</span><span class="info"><b>DAY ${r.day} · ${esc(r.name)}</b><small class="tiny">${timeK(r.end)} · ${esc(r.reason)}</small></span><span class="badge ${r.pass?'good':'bad'}">${statusText(r)}</span></button>`).join(''):'<div class="panel center" style="margin-top:12px">아직 시험 기록이 없습니다.</div>'}<div class="notice">이 기기 저장소의 기록입니다. 서버 통보는 설정에서 활성화합니다. 기기 데이터 삭제 시 로컬 기록이 없어질 수 있습니다.</div>`}
function settings(){main.innerHTML=`<h3>응시 및 통보 설정</h3><div class="panel" style="margin-top:12px"><label for="name">응시자 이름 / 별명</label><input class="field" id="name" maxlength="40" value="${esc(S.name)}" placeholder="예: 학생 A"><label><input type="checkbox" id="notify" ${S.notify?'checked':''} ${REQUIRE_NOTIFY?'disabled':''}> 보호자 자동 통보 ${REQUIRE_NOTIFY?'필수 (배포 모드)':'사용 (Worker 필요)'}</label><div style="margin-top:13px"><label for="code">가족 연결 코드</label><input class="field" id="code" type="password" maxlength="128" value="${esc(S.code)}" autocomplete="off" placeholder="Worker FAMILY_CODE와 동일"></div>${btn('설정 저장','saveSettings','primary')}${btn('서버 연결 확인','checkServer','outline')}<div id="checkMsg" class="tiny" style="margin-top:10px"></div></div><div class="notice">자동 통보는 시험 시작·종료 시 Telegram 메시지를 전송하고 전체 로그는 Cloudflare D1에 저장합니다. ${REQUIRE_NOTIFY?'이 배포 모드에서는 통보를 끌 수 없습니다.':'Worker 배포 및 비밀키 설정 전에는 로컬 모드로 이용하세요.'} 설정은 이 브라우저에 저장됩니다.</div><div class="panel"><h3>출처 및 정책</h3><p class="tiny">2027학년도 수능 영어 홀수형 18~45번 본문·선택지. 출제형을 기본형으로 정리했으며 뜻과 난이도는 학습용으로 자체 분류했습니다. 일부 복합어 포함. 공식 난이도 분류가 아닙니다. V2 원문 기능은 직접 가져온 PDF 또는 텍스트를 기반으로 하며 AI 번역은 검토가 필요합니다.</p><a href="${SOURCE}" target="_blank" rel="noopener">평가원 원본 문제지 보기 ↗</a><p class="tiny">카메라, 마이크, 위치, 다른 앱 내용은 수집하지 않습니다. 시험 이탈 감지는 웹 브라우저가 제공하는 이벤트에 한정됩니다. 앱 전환 자체를 OS 수준에서 막을 수 없습니다.</p></div><div class="foot">WORD RUN v${VERSION} · ${S.outbox.length}건 전송 대기</div>`}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function currentResult(){return S.history.find(x=>x.id===resultId)||S.history[0]}
function reportText(r){return `WORD RUN | DAY ${r.day}\n응시자: ${r.name}\n결과: ${statusText(r)} / ${r.score}점\n정답 ${r.score/2}/50, 응답 ${Object.keys(r.answers).length}/50\n시작: ${timeK(r.start)}\n종료: ${timeK(r.end)}\n사유: ${r.reason}\n로그 ${r.logs.length}건 / 이탈 ${r.logs.filter(l=>l.type==='VIOLATION').length}건\n오답: ${r.wrong.map(id=>word(id).w).join(', ')}`}
async function reportPng(r){let c=document.createElement('canvas');c.width=1280;c.height=720;let ctx=c.getContext('2d');ctx.fillStyle='#101d35';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#b9f34a';ctx.fillRect(0,0,1280,12);ctx.font='bold 36px sans-serif';ctx.fillText('WORD RUN.  /  2027 CSAT',65,80);ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText(`DAY ${r.day}  ·  ${r.name.slice(0,22)}`,65,148);ctx.fillStyle=r.pass?'#b9f34a':'#ff8ca0';ctx.font='bold 130px sans-serif';ctx.fillText(`${r.score}`,65,305);ctx.font='bold 38px sans-serif';ctx.fillText(statusText(r),320,270);ctx.fillStyle='#d0dbee';ctx.font='28px sans-serif';let lines=[`정답 ${r.score/2}/50  |  응답 ${Object.keys(r.answers).length}/50`,`시작  ${timeK(r.start)}`,`종료  ${timeK(r.end)}`,`사유  ${r.reason.slice(0,36)}`,`로그 ${r.logs.length}건  |  이탈 감지 ${r.logs.filter(l=>l.type==='VIOLATION').length}건`];lines.forEach((s,i)=>ctx.fillText(s,65,365+i*53));ctx.font='20px sans-serif';ctx.fillStyle='#9bb0cc';ctx.fillText('브라우저 감지 기록은 부정행위 확정 증거가 아닙니다.',65,675);return new Promise(res=>c.toBlob(res,'image/png'))}
async function share(){let r=currentResult();try{let b=await reportPng(r),f=new File([b],`wordrun-day${r.day}.png`,{type:'image/png'});if(navigator.share){if(navigator.canShare?.({files:[f]})){await navigator.share({title:'WORD RUN 시험 결과',text:reportText(r),files:[f]})}else await navigator.share({title:'WORD RUN 시험 결과',text:reportText(r)});return}if(navigator.clipboard){await navigator.clipboard.writeText(reportText(r));modal('결과 복사 완료','<p>카카오톡이나 문자에 붙여넣으세요.</p>',[['닫기',null,'primary']]);return}}catch(e){if(e.name==='AbortError')return}modal('결과 직접 공유',`<textarea class="field" rows="8" readonly>${esc(reportText(r))}</textarea>`,[['닫기',null,'outline']])}
main.addEventListener('click',handle);$('#nav').addEventListener('click',handle);
async function handle(e){let b=e.target.closest('[data-act]');if(!b||b.disabled)return;let [a,v]=b.dataset.act.split(':');if(starting)return;if(E&&!['answer','examNext','quit'].includes(a))return;if(['home','study','history','settings','words'].includes(a)){show(a);return}if(a==='today'){D=current();show('study')}else if(a==='day'){if(unlocked(+v)){D=+v;show('study')}}else if(a==='learnStart')startLearn();else if(a==='reveal'){L.reveal=true;learn()}else if(a==='hideMeaning'){L.reveal=!L.reveal;learn()}else if(a==='learnNext')rateLearn(true);else if(a==='learnAgain')rateLearn(false);else if(a==='contextSave')saveContext();else if(a==='contextImport')importContext();else if(a==='contextTranslate')translateContext();else if(a==='translateDay')translateDay();else if(a==='contextReset'){delete S.contexts[L.queue[L.i].id];save();learn()}else if(a==='pdfImport')$('#sourcePdf').click();else if(a==='exampleSpeak'){let w=L.queue[L.i],c=getContext(w);speakText(c?.en||w.example?.[0]||w.w)}else if(a==='speak')speakText(L.queue[L.i].w);else if(a==='review')startPractice(true);else if(a==='practiceStart')startPractice(false);else if(a==='practiceNext')practiceNext();else if(a==='examIntro')intro();else if(a==='answer'){if(E)examAnswer(+v);else if(P&&screen==='practice')practiceAnswer(+v)}else if(a==='examNext')examNext();else if(a==='quit')modal('시험 중단','<p>중단하면 자동 탈락 처리됩니다.</p>',[['중단 확정',()=>terminate('disqualified','응시자 시험 중단'),'danger'],['시험 계속',null,'outline']]);else if(a==='result'){resultId=v;show('result')}else if(a==='resultStudy'){D=currentResult().day;show('study')}else if(a==='share')share();else if(a==='png'){let r=currentResult(),blob=await reportPng(r);if(blob)download(blob,`wordrun-day${r.day}.png`)}else if(a==='json'){let r=currentResult();download(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),`wordrun-${r.id}.json`)}else if(a==='saveSettings'){S.name=$('#name').value.trim();S.code=$('#code').value;S.notify=REQUIRE_NOTIFY||$('#notify').checked;save();flush();modal('설정 저장','<p>현재 브라우저에 저장했습니다.</p>',[['닫기',null,'primary']])}else if(a==='checkServer'){let msg=$('#checkMsg');msg.textContent='연결 확인 중…';try{let j=await api('/api/check',{code:$('#code').value});msg.textContent='연결 성공 · '+(j.telegram?'Telegram 설정 확인':'Telegram 미설정') }catch(e){msg.textContent='연결 실패: '+e.message}}}
document.addEventListener('change',e=>{if(e.target.id==='sourcePdf'&&e.target.files?.[0])readSourcePDF(e.target.files[0])});if(S.active)restore();else show('home');flush();
</script></body></html>
