[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csat-corpus-pipeline"
version = "2.0.0"
description = "10-year (2017-2026 / 2018-2027 CSAT) English exam corpus parser, Gries DP_norm analyzer, 5-tier JSON exporter, and SQLite+FTS5 compiler"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
full = [
    "pymupdf>=1.24.0",
    "python-hwpx>=1.6.0",
    "olefile>=0.47",
    "spacy>=3.7.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
]
